        "400":
          description: 請求參數錯誤或重複領取
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到包裹
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 標記包裹已領取
      tags:
      - Parcel Management
