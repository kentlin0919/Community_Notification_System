        "200":
          description: 登入成功，返回 JWT Token 和使用者詳細資訊
          schema:
            $ref: '#/definitions/account.UserRequest'
        "400":
          description: 無效的輸入資料
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 帳號或密碼錯誤
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 使用者不存在
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 系統錯誤、JWT 簽發失敗或更新登入狀態失敗
