  community.RegisterApplicationRequest:
    properties:
      address:
        example: 251新北市淡水區濱海路一段306巷
        type: string
      admin_email:
        example: admin@example.com
        type: string
      admin_name:
        example: AdminName
        type: string
      admin_password:
        example: password123
        minLength: 6
        type: string
      admin_phone:
        example: "0912345678"
        type: string
      alley_number:
        example: 0
        type: integer
      applicant_email:
        example: applicant@example.com
        type: string
      applicant_name:
        example: ApplicantName
        type: string
      applicant_phone:
        example: "0987654321"
        type: string
      community_name:
        example: 甜水郡社區
        type: string
      district:
        example: 淡水區
        type: string
      lane_number:
        example: 306
        type: integer
      municipality:
        example: 新北市
        type: string
      postal_code:
        example: 251
        type: integer
      remark:
        example: 申請建立測試社區
