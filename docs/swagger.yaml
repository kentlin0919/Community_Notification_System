      - Home
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 使用者提供帳號與密碼後登入系統，並取得 JWT Token。登入成功後會設置 session cookie 並返回 JWT token。
      parameters:
      - description: 登入資料（Email, Password, Fcmtoken）
