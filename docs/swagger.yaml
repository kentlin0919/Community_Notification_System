definitions:
  account.Register:
    properties:
      Email:
        example: user@example.com
        type: string
      bethday:
        example: "2025-03-23T15:04:05-00:00"
        type: string
      community_id:
        example: 1
        type: integer
      home_id:
        example: "1"
        type: string
      name:
        example: kent
        type: string
      password:
        example: yourpassword
        type: string
      permission:
        example: 1
        type: integer
      platform:
        example: 1
        type: integer
    type: object
  account.User:
    properties:
      email:
        example: kent900919@gmail.com
        type: string
      fcmtoken:
        example: example-fcm-token
        type: string
      password:
        example: "09190919"
        type: string
      platform:
        example: App
        type: string
    type: object
  account.UserInfo:
    properties:
      Birthdaytime:
        example: "2025-03-23T15:04:05Z"
        type: string
      Home_id:
        type: string
      PermissionId:
        type: integer
      Platform:
        type: integer
      Session_id:
        type: string
      community_id:
        type: integer
      email:
        type: string
      name:
        type: string
    type: object
  account.UserRequest:
    properties:
      message:
        example: Login successful
        type: string
      token:
        example: example-jwt-token
        type: string
      user_info:
        $ref: '#/definitions/account.UserInfo'
    type: object
  community.CommunityListResponse:
    properties:
      communities:
        items:
          $ref: '#/definitions/community.CommunitySummary'
        type: array
      total:
        example: 1
        type: integer
    type: object
  community.CommunitySummary:
    properties:
      address:
        example: 251新北市淡水區濱海路一段306巷
        type: string
      alley_number:
        example: 0
        type: integer
      community_id:
        example: 1
        type: integer
      community_name:
        example: 甜水郡社區
        type: string
      district:
        example: 淡水區
        type: string
      lane_number:
        example: 306
        type: integer
      municipality:
        example: 新北市
        type: string
      postal_code:
        example: 251
        type: integer
      road_name:
        example: 濱海路一段
        type: string
    type: object
  community.RegisterApplicationRequest:
    properties:
      address:
        example: 251新北市淡水區濱海路一段306巷
        type: string
      admin_email:
        example: admin@example.com
        type: string
      admin_name:
        example: AdminName
        type: string
      admin_password:
        example: password123
        minLength: 6
        type: string
      admin_phone:
        example: "0912345678"
        type: string
      alley_number:
        example: 0
        type: integer
      applicant_email:
        example: applicant@example.com
        type: string
      applicant_name:
        example: ApplicantName
        type: string
      applicant_phone:
        example: "0987654321"
        type: string
      community_name:
        example: 甜水郡社區
        type: string
      district:
        example: 淡水區
        type: string
      lane_number:
        example: 306
        type: integer
      municipality:
        example: 新北市
        type: string
      postal_code:
        example: 251
        type: integer
      remark:
        example: 申請建立測試社區
        type: string
      road_name:
        example: 濱海路一段
        type: string
    required:
    - address
    - admin_email
    - admin_name
    - admin_password
    - applicant_email
    - applicant_name
    - community_name
    - district
    - municipality
    - postal_code
    - road_name
    type: object
  community.RejectApplicationRequest:
    properties:
      reject_reason:
        example: 資訊不全，請重新申請
        type: string
    type: object
  facility.CreateFacilityRequest:
    properties:
      community_id:
        type: integer
      cover_image:
        type: string
      description:
        type: string
      facility_type:
        maxLength: 50
        type: string
      location:
        type: string
      name:
        maxLength: 100
        type: string
      status:
        enum:
        - draft
        - active
        - inactive
        - maintenance
        type: string
    required:
    - community_id
    - facility_type
    - name
    type: object
  message_model.FCMNotificationRequest:
    properties:
      Userselect:
        items:
          type: string
        type: array
      body:
        type: string
      deviceToken:
        type: string
      title:
        type: string
    required:
    - body
    - deviceToken
    - title
    type: object
  message_model.MessageRequest:
    properties:
      Message:
        example: Sucessful send Message
        type: string
    type: object
  model.ErrorRequest:
    properties:
      code:
        example: 400
        type: integer
      error:
        example: error
        type: string
      status:
        example: Bad Request
        type: string
    type: object
  model.RequestMessage:
    properties:
      Message:
        example: message
        type: string
    type: object
  model.Response400Error:
    properties:
      code:
        example: 400
        type: integer
      error:
        example: Invalid input data
        type: string
      status:
        example: Bad Request
        type: string
    type: object
  model.Response401Error:
    properties:
      code:
        example: 401
        type: integer
      error:
        example: Invalid or missing JWT token
        type: string
      status:
        example: Unauthorized
        type: string
    type: object
  model.Response403Error:
    properties:
      code:
        example: 403
        type: integer
      error:
        example: Permission denied
        type: string
      status:
        example: Forbidden
        type: string
    type: object
  model.Response404Error:
    properties:
      code:
        example: 404
        type: integer
      error:
        example: Resource not found
        type: string
      status:
        example: Not Found
        type: string
    type: object
  model.Response500Error:
    properties:
      code:
        example: 500
        type: integer
      error:
        example: Internal server error
        type: string
      status:
        example: Internal Server Error
        type: string
    type: object
  parcel.CreateParcelRequest:
    properties:
      courier_company:
        type: string
      home_id:
        type: integer
      remark:
        type: string
      tracking_number:
        type: string
    required:
    - courier_company
    - home_id
    - tracking_number
    type: object
  permission.UpdatePermissionProfileRequest:
    properties:
      description:
        type: string
      display_name:
        maxLength: 50
        type: string
      permission_id:
        maximum: 7
        minimum: 3
        type: integer
    required:
    - display_name
    - permission_id
    type: object
  platform.PlatformListResponse:
    properties:
      platforms:
        items:
          $ref: '#/definitions/platform.PlatformSummary'
        type: array
      total:
        type: integer
    type: object
  platform.PlatformSummary:
    properties:
      name:
        type: string
    type: object
info:
  contact: {}
  description: Community_Notification_System
  title: Community_Notification_System
  version: "1.0"
paths:
  /api/v1/admin/facilities:
    post:
      consumes:
      - application/json
      description: 社區管理員新增公用設施與預設預約條件
      parameters:
      - description: 設施資料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/facility.CreateFacilityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 設施新增成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "409":
          description: 該社區已存在相同名稱的設施
          schema:
            $ref: '#/definitions/model.ErrorRequest'
      security:
      - BearerAuth: []
      summary: 新增預約設施
      tags:
      - Facility Management
  /api/v1/admin/permissions/profile:
    put:
      consumes:
      - application/json
      description: 社區 Admin (或 Super admin) 可修改 PermissionID = 3~7 的顯示名稱。
      parameters:
      - description: 更新請求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/permission.UpdatePermissionProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 這不是允許您管理的社區
          schema:
            $ref: '#/definitions/model.Response403Error'
      security:
      - BearerAuth: []
      summary: 管理社區專屬角色名稱
      tags:
      - Permission Management
  /api/v1/community/getlist:
    get:
      consumes:
      - application/json
      description: 依縣市、行政區、郵遞區號或關鍵字等條件查詢社區基本資料清單，並支援分頁查詢。
      parameters:
      - description: 縣市過濾（例如：新北市）
        in: query
        name: municipality
        type: string
      - description: 行政區過濾（例如：淡水區）
        in: query
        name: district
        type: string
      - description: 郵遞區號過濾（例如：251）
        in: query
        name: postal_code
        type: integer
      - description: 關鍵字搜尋（社區名稱或地址）
        in: query
        name: keyword
        type: string
      - description: 頁碼（從 1 開始，預設 1）
        in: query
        name: page
        type: integer
      - description: 每頁筆數（預設 20，最大 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功取得社區清單
          schema:
            $ref: '#/definitions/community.CommunityListResponse'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 取得社區列表
      tags:
      - CommunityManager
  /api/v1/community/register:
    post:
      consumes:
      - application/json
      description: 社區申請人填寫基本資料送出申請，狀態預設為 pending。
      parameters:
      - description: 社區申請資料
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/community.RegisterApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 社區申請已送出
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      summary: 社區送出申請
      tags:
      - CommunityManager
  /api/v1/community/register/{id}/approve:
    patch:
      consumes:
      - application/json
      description: 僅允許 Super admin 操作，核可後建立正式社區與初始 admin 帳號。
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 核可成功，回傳社區與管理員資訊
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求錯誤或無此申請單
          schema:
            $ref: '#/definitions/model.Response400Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "500":
          description: 核可流程失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 核可社區申請
      tags:
      - CommunityManager
  /api/v1/community/register/{id}/reject:
    patch:
      consumes:
      - application/json
      description: 僅允許 Super admin 操作，駁回申請並提供原因。
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      - description: 駁回原因
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/community.RejectApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已駁回申請
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求錯誤或無此申請單
          schema:
            $ref: '#/definitions/model.Response400Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "500":
          description: 駁回流程失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 駁回社區申請
      tags:
      - CommunityManager
  /api/v1/deleteUser:
    post:
      consumes:
      - application/json
      description: 使用者提供帳號與密碼後刪除使用者
      parameters:
      - description: 使用者資料（Email & Password ＆ Platform）
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/account.User'
      produces:
      - application/json
      responses:
        "200":
          description: 登入成功，返回 JWT Token 和成功訊息
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的輸入資料
          schema:
            $ref: '#/definitions/model.ErrorRequest'
        "401":
          description: 密碼錯誤
          schema:
            $ref: '#/definitions/model.ErrorRequest'
        "404":
          description: 使用者不存在
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 系統錯誤或 JWT 簽發失敗
          schema:
            $ref: '#/definitions/model.ErrorRequest'
      security:
      - BearerAuth: []
      summary: 使用者刪除
      tags:
      - User
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 使用者提供帳號與密碼後登入系統，並取得 JWT Token。登入成功後會設置 session cookie 並返回 JWT token。
      parameters:
      - description: 登入資料（Email & Password）
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/account.User'
      produces:
      - application/json
      responses:
        "200":
          description: 登入成功，返回 JWT Token 和成功訊息
          schema:
            $ref: '#/definitions/account.UserRequest'
        "400":
          description: 無效的輸入資料
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 密碼錯誤
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 使用者不存在
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 系統錯誤或 JWT 簽發失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      summary: 使用者登入
      tags:
      - User
  /api/v1/parcels:
    get:
      consumes:
      - application/json
      description: 查詢指定社區的包裹列表，可透過 home_id 與 status 篩選
      parameters:
      - description: 住戶 ID
        in: query
        name: home_id
        type: integer
      - description: 狀態 (1=待領取, 2=已領取)
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查詢成功
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 查詢包裹列表
      tags:
      - Parcel Management
    post:
      consumes:
      - application/json
      description: 管理員登錄代收包裹資訊，系統自動發送 FCM 推播通知給該住戶所有成員
      parameters:
      - description: 包裹資料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/parcel.CreateParcelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 包裹登錄成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "409":
          description: 重複單號
          schema:
            $ref: '#/definitions/model.ErrorRequest'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 代收登錄包裹
      tags:
      - Parcel Management
  /api/v1/parcels/{id}/pickup:
    put:
      consumes:
      - application/json
      description: 管理員確認住戶領取包裹後，將包裹狀態更新為「已領取」
      parameters:
      - description: 包裹 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 包裹領取成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求參數錯誤或重複領取
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到包裹
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 標記包裹已領取
      tags:
      - Parcel Management
  /api/v1/permissions/profile:
    get:
      description: 取得社區客製化的 3~7 等級角色。
      produces:
      - application/json
      responses:
        "200":
          description: 成功回傳
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
      security:
      - BearerAuth: []
      summary: 查詢社區角色列表
      tags:
      - Permission Management
  /api/v1/platform/getlist:
    get:
      consumes:
      - application/json
      description: 取得所有可用平台名稱，供前端顯示於選項列表。
      produces:
      - application/json
      responses:
        "200":
          description: 成功取得平台清單
          schema:
            $ref: '#/definitions/platform.PlatformListResponse'
        "500":
          description: 取得平台資料失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      summary: 取得平台列表
      tags:
      - Platform
  /api/v1/register:
    post:
      consumes:
      - application/json
      description: 新用戶註冊功能，包含基本資料驗證、密碼加密、JWT Token 生成和 Session 設置
      parameters:
      - description: 註冊資料（Email、Password、Name、Birthday、Permission、Platform）
        in: body
        name: Register
        required: true
        schema:
          $ref: '#/definitions/account.Register'
      produces:
      - application/json
      responses:
        "200":
          description: 註冊成功，返回 JWT Token 和成功訊息
          schema:
            $ref: '#/definitions/account.UserRequest'
        "400":
          description: 無效的輸入資料或帳號已存在
          schema:
            $ref: '#/definitions/model.Response400Error'
        "500":
          description: 系統錯誤或 JWT 簽發失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      summary: 使用者註冊
      tags:
      - User
  /api/v1/sendmessage:
    post:
      consumes:
      - application/json
      description: 使用者傳送訊息，需要 JWT Token 驗證
      parameters:
      - description: 訊息資料
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/message_model.FCMNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 訊息送出成功
          schema:
            $ref: '#/definitions/message_model.MessageRequest'
        "400":
          description: 輸入資料格式錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 未授權，缺少或無效的 JWT Token
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 伺服器內部錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 傳送訊息
      tags:
      - Message
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
