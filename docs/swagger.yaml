        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功標記已讀
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 通知不存在
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 標記通知為已讀
      tags:
      - Message
  /api/v1/messages/read-all:
    patch:
      consumes:
      - application/json
      description: 將登入使用者所有未讀通知標記為已讀。
      produces:
      - application/json
      responses:
        "200":
          description: 成功全部標記已讀
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 全部標記已讀
      tags:
      - Message
  /api/v1/messages/send:
    post:
      consumes:
      - application/json
      description: 管理者傳送社區訊息。系統會先為每位收件者建立 message_info 寄送紀錄，再嘗試透過 FCM 推播；Firebase
        未初始化或部分推播失敗時仍會保留寄送紀錄並於回應中標示失敗數量。
      parameters:
      - description: 訊息資料
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/message_model.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 訊息送出完成
          schema:
            $ref: '#/definitions/message_model.SendMessageResponse'
        "400":
          description: 輸入資料格式錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 未授權，缺少或無效的 JWT Token
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到符合條件的收件者
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 伺服器內部錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 傳送訊息
      tags:
      - Message
  /api/v1/parcels:
    get:
      consumes:
      - application/json
      description: 查詢指定社區的包裹列表，可透過 home_id 與 status 篩選
