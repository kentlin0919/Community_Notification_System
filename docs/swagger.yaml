    - title
    type: object
  message_model.SendMessageResponse:
    properties:
      data:
        $ref: '#/definitions/message_model.SendMessageResponseData'
      message:
        type: string
    type: object
  message_model.SendMessageResponseData:
    properties:
      created_message_ids:
