      parameters:
      - description: 頁碼（預設 1）
        in: query
        name: page
        type: integer
      - description: 每頁筆數（預設 20，最大 100）
        in: query
        name: page_size
        type: integer
      - description: 已讀篩選
        in: query
        name: is_read
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 成功取得通知列表
          schema:
            $ref: '#/definitions/message_model.MessageListResponse'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 取得通知列表
      tags:
      - Message
  /api/v1/messages/{id}/read:
    patch:
      consumes:
      - application/json
