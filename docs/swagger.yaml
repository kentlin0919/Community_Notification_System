            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到預約
          schema:
            $ref: '#/definitions/model.Response404Error'
      security:
      - BearerAuth: []
      summary: 取得預約詳情
      tags:
      - Reservation
  /api/v1/reservations/{id}/cancel:
    patch:
      consumes:
      - application/json
      description: 住戶主動取消已建立的設施預約。需提供取消原因。
      parameters:
      - description: 預約紀錄 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 取消原因
        in: body
        name: cancel
        required: true
        schema:
          $ref: '#/definitions/reservation.CancelReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 預約已成功取消
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的 ID 或取消失敗
          schema:
            $ref: '#/definitions/model.Response400Error'
      security:
      - BearerAuth: []
      summary: 取消預約
      tags:
      - Reservation
  /api/v1/reservations/{id}/reschedule:
    post:
      consumes:
      - application/json
      description: 住戶針對現有的預約申請變更日期或時段。申請後需經由管理員審核。
      parameters:
      - description: 預約紀錄 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新的預約時段與原因
        in: body
        name: reschedule
        required: true
        schema:
          $ref: '#/definitions/reservation.RescheduleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 改期申請已送出
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的 ID 或輸入資料
          schema:
            $ref: '#/definitions/model.Response400Error'
        "404":
          description: 找不到預約紀錄
          schema:
            $ref: '#/definitions/model.Response404Error'
        "409":
          description: 改期衝突或處理失敗
          schema:
            $ref: '#/definitions/model.Response409Error'
      security:
      - BearerAuth: []
      summary: 申請預約改期
      tags:
      - Reservation
  /api/v1/sendmessage:
    post:
      consumes:
      - application/json
      description: 管理者傳送社區訊息。系統會先為每位收件者建立 message_info 寄送紀錄，再嘗試透過 FCM 推播；Firebase
        未初始化或部分推播失敗時仍會保留寄送紀錄並於回應中標示失敗數量。
      parameters:
      - description: 訊息資料
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/message_model.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 訊息送出完成
          schema:
            $ref: '#/definitions/message_model.SendMessageResponse'
        "400":
          description: 輸入資料格式錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 未授權，缺少或無效的 JWT Token
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到符合條件的收件者
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 伺服器內部錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 傳送訊息
      tags:
      - Message
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
