    type: object
  facility.FacilityListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/facility_db.FacilityInfo'
        type: array
    type: object
  facility.UpdateFacilityRequest:
    properties:
      auto_approve:
        example: false
        type: boolean
      cancel_before_hours:
        example: 24
        minimum: 0
        type: integer
      cover_image:
        example: https://example.com/facility.jpg
        type: string
      description:
        example: 提供跑步機、啞鈴等健身設備。
        type: string
      facility_type:
        example: 運動設施
        maxLength: 50
        type: string
      location:
        example: B1 棟
        type: string
