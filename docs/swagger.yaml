  message_model.SendMessageResult:
    properties:
      email:
        type: string
      error:
        type: string
      fcm_message_id:
        type: string
      fcm_status:
        type: string
      message_id:
        type: string
      success:
        type: boolean
      user_id:
        type: string
    type: object
  model.RequestMessage:
    properties:
      Message:
        example: message
        type: string
    type: object
  model.Response400Error:
    properties:
      code:
        example: 400
        type: integer
      error:
        example: Invalid input data
        type: string
      internal_code:
        example: 1001
        type: integer
      request_id:
        example: uuid-string
        type: string
      status:
        example: Bad Request
        type: string
    type: object
  model.Response401Error:
    properties:
      code:
        example: 401
        type: integer
      error:
        example: Invalid or missing JWT token
        type: string
      internal_code:
        example: 1002
        type: integer
      request_id:
        example: uuid-string
        type: string
      status:
        example: Unauthorized
        type: string
    type: object
  model.Response403Error:
    properties:
      code:
        example: 403
        type: integer
      error:
        example: Permission denied
        type: string
      internal_code:
        example: 1003
        type: integer
      request_id:
        example: uuid-string
        type: string
      status:
        example: Forbidden
        type: string
    type: object
  model.Response404Error:
    properties:
      code:
        example: 404
        type: integer
      error:
        example: Resource not found
        type: string
      internal_code:
        example: 1004
        type: integer
      request_id:
        example: uuid-string
        type: string
      status:
        example: Not Found
        type: string
    type: object
  model.Response409Error:
    properties:
      code:
        example: 409
        type: integer
      error:
        example: Resource conflict
        type: string
      internal_code:
        example: 1005
        type: integer
      request_id:
        example: uuid-string
        type: string
      status:
        example: Conflict
        type: string
    type: object
  model.Response500Error:
    properties:
      code:
        example: 500
        type: integer
      error:
        example: Internal server error
        type: string
      internal_code:
        example: 1000
        type: integer
      request_id:
        example: uuid-string
        type: string
      status:
        example: Internal Server Error
        type: string
    type: object
  parcel.CreateParcelRequest:
    properties:
      courier_company:
        example: 黑貓宅急便
        type: string
      home_id:
        example: 1
        type: integer
      remark:
        example: 貴重物品
        type: string
      tracking_number:
        example: "1234567890"
        type: string
    required:
    - courier_company
    - home_id
    - tracking_number
    type: object
  parcel.ParcelListResponse:
    properties:
      community_id:
        example: 1
        type: integer
      courier_company:
        example: 黑貓宅急便
        type: string
      created_by:
        example: admin-uuid
        type: string
      home_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      picked_up_at:
        example: "2025-05-10T10:00:00Z"
        type: string
      received_at:
        example: "2025-05-10T08:00:00Z"
        type: string
      remark:
        example: 貴重物品
        type: string
      status:
        description: '0: 待領取, 1: 已領取'
        example: 0
        type: integer
      tracking_number:
        example: "1234567890"
        type: string
    type: object
  permission.UpdatePermissionProfileRequest:
    properties:
      description:
        example: 負責社區重大決策與管理
        type: string
      display_name:
        example: 社區主委
        maxLength: 50
        type: string
      permission_id:
        example: 3
        maximum: 7
        minimum: 3
        type: integer
    required:
    - display_name
    - permission_id
    type: object
  platform.PlatformListResponse:
    properties:
      platforms:
        items:
          $ref: '#/definitions/platform.PlatformSummary'
        type: array
      total:
        type: integer
    type: object
  platform.PlatformSummary:
    properties:
      name:
        type: string
    type: object
  reservation.ApproveRescheduleRequest:
    properties:
      admin_comment:
        example: 已核准改期申請
        type: string
      is_approve:
        description: 'true: 核准, false: 拒絕'
        example: true
        type: boolean
    type: object
  reservation.CancelReservationRequest:
    properties:
      cancel_reason:
        example: 臨時有事無法前往
        type: string
    type: object
  reservation.CreateReservationRequest:
    properties:
      end_time:
        description: HH:mm
        example: "15:00"
        type: string
      home_id:
        description: 可選，看業務邏輯
        example: 1
        type: integer
      people_count:
        example: 2
        minimum: 1
        type: integer
      remark:
        example: 使用跑步機
        type: string
      reservation_date:
        description: YYYY-MM-DD
        example: "2025-05-20"
        type: string
      start_time:
        description: HH:mm
        example: "14:00"
        type: string
    required:
    - end_time
    - people_count
    - reservation_date
    - start_time
    type: object
  reservation.RescheduleRequest:
    properties:
      new_date:
        example: "2025-05-21"
        type: string
      new_end_time:
        example: "11:00"
        type: string
      new_start_time:
        example: "10:00"
        type: string
      reason:
        example: 原本時段突然要開會
        type: string
    required:
    - new_date
    - new_end_time
    - new_start_time
    type: object
info:
  contact: {}
  description: 此 API 文件提供社區通知系統的後端介面說明，包含使用者管理、設施預約、社區申請及訊息通知等功能。使用 JWT Bearer 進行認證。
  title: 社區通知系統 API 文件 (Community Notification System)
  version: "1.0"
paths:
  /api/v1/admin/facilities:
    post:
      consumes:
      - application/json
      description: 社區管理員新增公用設施與預設預約條件。系統會同時建立一筆預設的設施規則。
      parameters:
      - description: 設施基本資料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/facility.CreateFacilityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 設施新增成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊或認證失敗
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足，僅限管理員
          schema:
            $ref: '#/definitions/model.Response403Error'
        "409":
          description: 該社區已存在相同名稱的設施
          schema:
            $ref: '#/definitions/model.Response409Error'
        "500":
          description: 系統建立設施失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 新增預約設施
      tags:
      - Facility Management
  /api/v1/admin/facilities/{id}:
    delete:
      description: 社區管理員軟刪除設施，既有預約歷史保留。
      parameters:
      - description: 設施 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 設施刪除成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的設施 ID
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "404":
          description: 找不到設施
          schema:
            $ref: '#/definitions/model.Response404Error'
      security:
      - BearerAuth: []
      summary: 軟刪除設施
      tags:
      - Facility Management
    put:
      consumes:
      - application/json
      description: 社區管理員更新設施基本資訊與預約規則。
      parameters:
      - description: 設施 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 設施更新資料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/facility.UpdateFacilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 設施更新成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效輸入
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "404":
          description: 找不到設施
          schema:
            $ref: '#/definitions/model.Response404Error'
        "409":
          description: 設施名稱衝突
          schema:
            $ref: '#/definitions/model.Response409Error'
      security:
      - BearerAuth: []
      summary: 更新設施
      tags:
      - Facility Management
  /api/v1/admin/permissions/profile:
    put:
      consumes:
      - application/json
      description: 社區 Admin (或 Super admin) 可修改 PermissionID = 3~7 的顯示名稱。用於客製化不同社區對同一權限等級的稱呼。
      parameters:
      - description: 社區 ID
        in: header
        name: community_id
        required: true
        type: string
      - description: 更新請求內容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/permission.UpdatePermissionProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 權限名稱更新成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 請求參數錯誤或 ID 範圍不符
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 認證失敗或無法取得社區資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "500":
          description: 系統更新失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 管理社區專屬角色名稱
      tags:
      - Permission Management
  /api/v1/admin/reschedule/{id}/approve:
    patch:
      consumes:
      - application/json
      description: 管理員針對住戶提出的改期申請進行核准或拒絕。
      parameters:
      - description: 改期申請紀錄 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 審核結果與意見
        in: body
        name: approve
        required: true
        schema:
          $ref: '#/definitions/reservation.ApproveRescheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 改期申請處理完成
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的 ID 或輸入資料
          schema:
            $ref: '#/definitions/model.Response400Error'
        "500":
          description: 審核處理失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 審核預約改期 (管理員)
      tags:
      - Reservation
  /api/v1/admin/reservations/{id}/delete:
    patch:
      description: 管理員軟刪除同社區預約，住戶列表將不再顯示該預約。
      parameters:
      - description: 預約 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 預約刪除成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的預約 ID
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "404":
          description: 找不到預約
          schema:
            $ref: '#/definitions/model.Response404Error'
      security:
      - BearerAuth: []
      summary: 管理員強制取消預約
      tags:
      - Reservation
  /api/v1/community/getlist:
    get:
      consumes:
      - application/json
      description: 依縣市、行政區、郵遞區號或關鍵字等條件查詢社區基本資料清單，並支援分頁查詢。
      parameters:
      - description: 縣市過濾（例如：新北市）
        in: query
        name: municipality
        type: string
      - description: 行政區過濾（例如：淡水區）
        in: query
        name: district
        type: string
      - description: 郵遞區號過濾（例如：251）
        in: query
        name: postal_code
        type: integer
      - description: 關鍵字搜尋（社區名稱或地址）
        in: query
        name: keyword
        type: string
      - description: 頁碼（從 1 開始，預設 1）
        in: query
        name: page
        type: integer
      - description: 每頁筆數（預設 20，最大 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功取得社區清單
          schema:
            $ref: '#/definitions/community.CommunityListResponse'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 取得社區列表
      tags:
      - CommunityManager
  /api/v1/community/register:
    post:
      consumes:
      - application/json
      description: 社區申請人填寫基本資料送出申請，狀態預設為 pending。
      parameters:
      - description: 社區申請資料
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/community.RegisterApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 社區申請已送出
          schema:
            $ref: '#/definitions/community.RegisterApplicationResponse'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "500":
          description: 系統錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      summary: 社區送出申請
      tags:
      - CommunityManager
  /api/v1/community/register/{id}/approve:
    patch:
      consumes:
      - application/json
      description: 僅允許 Super admin 操作，核可後建立正式社區與初始 admin 帳號。
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 核可成功，回傳社區與管理員資訊
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求錯誤或無此申請單
          schema:
            $ref: '#/definitions/model.Response400Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "500":
          description: 核可流程失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 核可社區申請
      tags:
      - CommunityManager
  /api/v1/community/register/{id}/reject:
    patch:
      consumes:
      - application/json
      description: 僅允許 Super admin 操作，駁回申請並提供原因。
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      - description: 駁回原因
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/community.RejectApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已駁回申請
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 請求錯誤或無此申請單
          schema:
            $ref: '#/definitions/model.Response400Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "500":
          description: 駁回流程失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 駁回社區申請
      tags:
      - CommunityManager
  /api/v1/deleteUser:
    post:
      consumes:
      - application/json
      description: 使用者提供帳號與密碼後進行帳號刪除。此操作為實體刪除且不可逆，執行前請務必確認。
      parameters:
      - description: 刪除驗證資料（Email, Password, Platform）
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/account.User'
      produces:
      - application/json
      responses:
        "202":
          description: 帳號刪除成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 請求格式錯誤或無效輸入
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 認證失敗或密碼錯誤
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到該使用者
          schema:
            $ref: '#/definitions/model.Response404Error'
        "500":
          description: 系統執行刪除時發生錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 刪除使用者帳號
      tags:
      - User
  /api/v1/facilities:
    get:
      description: 取得設施列表。可經由 Query 參數指定社區 ID；若未指定，則從 JWT Token 中自動提取。住戶只會看到 active
        設施；管理員可看到同社區全部未刪除設施。
      parameters:
      - description: 社區 ID
        in: query
        name: community_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 設施列表
          schema:
            $ref: '#/definitions/facility.FacilityListResponse'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "500":
          description: 查詢設施列表失敗
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 取得設施列表
      tags:
      - Facility Management
  /api/v1/facilities/{facility_id}/reservations:
    post:
      consumes:
      - application/json
      description: 住戶針對特定社區設施進行預約。系統會根據設施規則（如黑名單、預約時段重疊等）進行驗證。
      parameters:
      - description: 社區 ID
        in: header
        name: community_id
        required: true
        type: string
      - description: 設施 ID
        in: path
        name: facility_id
        required: true
        type: integer
      - description: 預約詳細資料
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/reservation.CreateReservationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 預約建立成功
          schema:
            $ref: '#/definitions/model.RequestMessage'
        "400":
          description: 無效的設施 ID 或輸入資料
          schema:
            $ref: '#/definitions/model.Response400Error'
        "403":
          description: 設施不開放或權限不足
          schema:
            $ref: '#/definitions/model.Response403Error'
        "404":
          description: 設施不存在
          schema:
            $ref: '#/definitions/model.Response404Error'
        "409":
          description: 時段衝突或違反設施規則
          schema:
            $ref: '#/definitions/model.Response409Error'
      security:
      - BearerAuth: []
      summary: 建立設施預約
      tags:
      - Reservation
  /api/v1/facilities/{id}:
    get:
      description: 依 JWT 社區取得單一設施詳情。
      parameters:
      - description: 設施 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 設施詳情
          schema:
            $ref: '#/definitions/facility.FacilityDetailResponse'
        "400":
          description: 無效的設施 ID
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "404":
          description: 找不到設施
          schema:
            $ref: '#/definitions/model.Response404Error'
      security:
      - BearerAuth: []
      summary: 取得單一設施詳情
      tags:
      - Facility Management
  /api/v1/home:
    get:
