      click_action:
        example: FLUTTER_NOTIFICATION_CLICK
        type: string
      entity_id:
        example: notice-1
        type: string
      entity_type:
        example: community
        type: string
    type: object
  message_model.SendMessageRequest:
    properties:
      Userselect:
        example:
        - user1@example.com
        - user2@example.com
        items:
          type: string
        type: array
      body:
        example: 您的包裹已抵達管理室，請抽空領取。
        type: string
      deviceToken:
        example: fcm-device-token
        type: string
      metadata:
        $ref: '#/definitions/message_model.SendMessageMetadata'
      recipient_emails:
        example:
        - user1@example.com
        - user2@example.com
        items:
          type: string
        type: array
      recipient_user_ids:
        example:
        - user-uuid-1
        - user-uuid-2
        items:
          type: string
        type: array
      subtitle:
        example: 包裹到達通知
        type: string
      target_type:
        example: selected_users
        type: string
      title:
        example: 您有新的包裹
        type: string
    required:
