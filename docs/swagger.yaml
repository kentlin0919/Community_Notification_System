      - description: 住戶 ID
        in: query
        name: home_id
        type: integer
      - description: 狀態 (1=待領取, 2=已領取)
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查詢成功
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 查詢包裹列表
      tags:
      - Parcel Management
    post:
      consumes:
      - application/json
      description: 管理員登錄代收包裹資訊，系統自動發送 FCM 推播通知給該住戶所有成員
      parameters:
      - description: 包裹資料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/parcel.CreateParcelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 包裹登錄成功
          schema:
            $ref: '#/definitions/parcel.ParcelListResponse'
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/model.Response400Error'
        "401":
          description: 無法取得登入資訊
          schema:
            $ref: '#/definitions/model.Response401Error'
        "409":
          description: 重複單號
          schema:
            $ref: '#/definitions/model.Response409Error'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/model.Response500Error'
      security:
      - BearerAuth: []
      summary: 代收登錄包裹
      tags:
      - Parcel Management
  /api/v1/parcels/{id}/pickup:
    put:
      consumes:
